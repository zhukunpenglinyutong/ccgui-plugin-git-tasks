name: release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Tag must equal manifest.version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME != manifest.version $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Stage assets
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          sha256sum main.js manifest.json styles.css > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/checksums.txt
          generate_release_notes: true
